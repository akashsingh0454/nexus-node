name: Release Nexus Node

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64 # Skip Windows ARM for now if not needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME=nexus
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME=nexus.exe
          fi
          
          mkdir -p build/
          go build -o build/$BINARY_NAME ./cmd/nexus
          
          # Compress artifacts
          if [ "$GOOS" = "windows" ]; then
            zip -j build/nexus-${{ matrix.goos }}-${{ matrix.goarch }}.zip build/$BINARY_NAME config.yaml
          else
            tar -czvf build/nexus-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build $BINARY_NAME -C . config.yaml
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/nexus-${{ matrix.goos }}-${{ matrix.goarch }}*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/nexus-${{ matrix.goos }}-${{ matrix.goarch }}*
          token: ${{ secrets.GITHUB_TOKEN }}
