agent:
  name: "nexus-node-01"
  log_level: "info"
  server_url: "https://nexus-controller.internal"

exporter:
  splunk:
    enabled: true
    url: "https://splunk-hec.internal:8088"
    token: "your-hec-token"
    batch_interval: 5s

modules:
  osquery:
    enabled: true
    binary_path: "./bin/osqueryd.exe"
  hive:
    enabled: true
    port: 31337
    cache_dir: "./cache"
  container:
    enabled: true
    socket_path: "/var/run/docker.sock"

remediation:
  enabled: true
  auto_patch_severity: ["CRITICAL", "HIGH"]
