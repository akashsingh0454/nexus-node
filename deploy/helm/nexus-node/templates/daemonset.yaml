apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nexus-node.fullname" . }}
  labels:
    {{- include "nexus-node.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nexus-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-node.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true # Required for Hive P2P/eBPF visibility
      hostPID: true     # Required for process monitoring
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/nexus"]
          args: ["--config", "/etc/nexus/config.yaml"]
          env:
            - name: NEXUS_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nexus
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "nexus-node.fullname" . }}-config
        {{- toYaml .Values.volumes | nindent 8 }}
